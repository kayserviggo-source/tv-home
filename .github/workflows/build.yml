name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk tv-home.apk

      - uses: actions/upload-artifact@v4
        with:
          name: tv-home-apk
          path: tv-home.apk
          if-no-files-found: error

      # Puts the APK on the repository's Releases page, so it can be downloaded as a plain file.
      # The newest release is what the app installed on the TV updates itself from.
      # Its first line is shown on the TV as what is new.
      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git log -1 --pretty=%B | sed '/^Co-Authored-By/,$d' > notes.txt
          gh release create "build-${{ github.run_number }}" tv-home.apk \
            --title "Build ${{ github.run_number }}" \
            --notes-file notes.txt --latest
