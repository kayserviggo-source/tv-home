<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, user-scalable=no">
<title>TV Home</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage">

  <!-- Home -->
  <section id="home" class="view">
    <header class="topbar">
      <div class="clock"><span class="time" data-clock="time"></span><span class="date" data-clock="date"></span></div>
      <div class="top-actions" data-zone="top">
        <button class="round f" id="btn-apps" aria-label="All apps">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></svg>
        </button>
        <button class="round f" id="btn-panel" aria-label="Control Centre">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
        </button>
      </div>
    </header>

    <div class="rows" id="rows">
      <div class="hero-row" data-zone="hero" data-columns>
        <div class="now" id="now">
          <div class="sleeve-wrap">
            <div class="record">
              <svg viewBox="0 0 200 200" aria-hidden="true"><circle cx="100" cy="100" r="100" class="vinyl"/><g class="grooves"><circle cx="100" cy="100" r="93"/><circle cx="100" cy="100" r="85"/><circle cx="100" cy="100" r="77"/><circle cx="100" cy="100" r="69"/><circle cx="100" cy="100" r="61"/><circle cx="100" cy="100" r="53"/><circle cx="100" cy="100" r="45"/></g></svg>
              <div class="label"><i></i><b></b></div>
            </div>
            <div class="sleeve"><img data-np="art" alt=""></div>
          </div>
          <div class="now-info">
            <div class="eyebrow" data-np="status"></div>
            <div class="now-title" data-np="title"></div>
            <div class="now-artist" data-np="artist"></div>
            <div class="now-hint" data-np="hint"></div>
            <div class="progress">
              <div class="bar"><i data-np="bar"></i></div>
              <div class="times"><span data-np="pos"></span><span data-np="dur"></span></div>
            </div>
            <div class="controls">
              <button class="ctl f" data-act="prev" aria-label="Previous track"><svg viewBox="0 0 24 24" aria-hidden="true" class="solid"><path d="M19 5v14l-10-7z"/><path d="M6 5v14" class="stroke"/></svg></button>
              <button class="ctl big f" data-act="toggle" aria-label="Play or pause">
                <svg viewBox="0 0 24 24" aria-hidden="true" class="ico-pause"><path d="M8 5v14M16 5v14"/></svg>
                <svg viewBox="0 0 24 24" aria-hidden="true" class="ico-play solid"><path d="M7 4.5v15l12.5-7.5z"/></svg>
              </button>
              <button class="ctl f" data-act="next" aria-label="Next track"><svg viewBox="0 0 24 24" aria-hidden="true" class="solid"><path d="M5 5v14l10-7z"/><path d="M18 5v14" class="stroke"/></svg></button>
              <button class="pill f push" data-act="player">Open player</button>
              <button class="pill f only-idle" data-act="music">Open Spotify</button>
              <button class="pill f only-setup" data-act="panel">Finish setup</button>
            </div>
          </div>
        </div>
        <div class="pins" id="pins"></div>
      </div>
      <div id="feed"></div>
    </div>
  </section>

  <!-- Player -->
  <section id="player" class="view">
    <header class="topbar">
      <button class="pill f" data-act="home">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 6l-6 6 6 6"/></svg><span>Home</span>
      </button>
      <div class="clock"><span class="time small" data-clock="time"></span></div>
    </header>
    <div class="player-main">
      <div class="sleeve-wrap large">
        <div class="record">
          <svg viewBox="0 0 200 200" aria-hidden="true"><circle cx="100" cy="100" r="100" class="vinyl"/><g class="grooves fine"><circle cx="100" cy="100" r="95"/><circle cx="100" cy="100" r="89"/><circle cx="100" cy="100" r="83"/><circle cx="100" cy="100" r="77"/><circle cx="100" cy="100" r="71"/><circle cx="100" cy="100" r="65"/><circle cx="100" cy="100" r="59"/><circle cx="100" cy="100" r="53"/><circle cx="100" cy="100" r="47"/><circle cx="100" cy="100" r="41"/></g></svg>
          <div class="label"><i></i><b></b></div>
        </div>
        <div class="sleeve"><img data-np="art" alt=""></div>
      </div>
      <div class="player-info">
        <div class="eyebrow" data-np="status"></div>
        <h1 class="player-title" data-np="title"></h1>
        <div class="player-artist" data-np="artist"></div>
        <div class="player-source" data-np="source"></div>
        <div class="progress">
          <div class="bar thick"><i data-np="bar"></i></div>
          <div class="times"><span data-np="pos"></span><span data-np="dur"></span></div>
        </div>
        <div class="controls" data-zone="player-controls">
          <button class="ctl mid f" data-act="back10" aria-label="Back 10 seconds"><span class="skip" aria-hidden="true">−10</span></button>
          <button class="ctl mid f" data-act="prev" aria-label="Previous track"><svg viewBox="0 0 24 24" aria-hidden="true" class="solid"><path d="M19 5v14l-10-7z"/><path d="M6 5v14" class="stroke"/></svg></button>
          <button class="ctl huge f" data-act="toggle" aria-label="Play or pause">
            <svg viewBox="0 0 24 24" aria-hidden="true" class="ico-pause"><path d="M8 5v14M16 5v14"/></svg>
            <svg viewBox="0 0 24 24" aria-hidden="true" class="ico-play solid"><path d="M7 4.5v15l12.5-7.5z"/></svg>
          </button>
          <button class="ctl mid f" data-act="next" aria-label="Next track"><svg viewBox="0 0 24 24" aria-hidden="true" class="solid"><path d="M5 5v14l10-7z"/><path d="M18 5v14" class="stroke"/></svg></button>
          <button class="ctl mid f" data-act="fwd10" aria-label="Forward 10 seconds"><span class="skip" aria-hidden="true">+10</span></button>
        </div>
        <div class="chips" data-zone="player-chips">
          <button class="pill f" data-act="panel">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.5 14.5A8 8 0 0 1 9.5 4.5a8 8 0 1 0 10 10z"/></svg><span data-sleep-label>Sleep timer · Off</span>
          </button>
          <button class="pill f" data-act="source-app"><span data-np="open-app">Open app</span></button>
        </div>
      </div>
    </div>
  </section>

  <!-- Idle screen while music plays -->
  <section id="ambient" class="view">
    <div class="ambient-main">
      <div>
        <div class="ambient-time" data-clock="time"></div>
        <div class="ambient-date" data-clock="date"></div>
      </div>
      <div class="ambient-now">
        <div class="sleeve-wrap mini">
          <div class="record">
            <svg viewBox="0 0 200 200" aria-hidden="true"><circle cx="100" cy="100" r="100" class="vinyl"/><g class="grooves coarse"><circle cx="100" cy="100" r="88"/><circle cx="100" cy="100" r="74"/><circle cx="100" cy="100" r="60"/><circle cx="100" cy="100" r="46"/></g></svg>
            <div class="label"><i></i><b></b></div>
          </div>
          <div class="sleeve"><img data-np="art" alt=""></div>
        </div>
        <div class="ambient-text">
          <div class="ambient-title" data-np="title"></div>
          <div class="ambient-artist" data-np="artist"></div>
          <div class="bar"><i data-np="bar"></i></div>
        </div>
      </div>
    </div>
    <div class="ambient-hint">Press any button to go back</div>
  </section>

  <!-- All apps -->
  <section id="allapps" class="view">
    <header class="topbar">
      <h1 class="page-title">All apps</h1>
      <div class="page-hint">Hold OK on an app to put it on Home or take it off</div>
    </header>
    <div class="grid-scroll" id="grid-scroll">
      <div class="app-grid" id="app-grid" data-zone="grid"></div>
    </div>
  </section>

  <!-- Control Centre -->
  <div id="scrim"></div>
  <aside id="panel" aria-label="Control Centre">
    <div class="panel-head">
      <h1>Control Centre</h1>
    </div>
    <div class="panel-body" id="panel-body"></div>
  </aside>

  <div id="toast" role="status"></div>
</div>

<script src="mock.js"></script>
<script src="app.js"></script>
</body>
</html>
