plugins {
    id 'com.android.application'
}

android {
    namespace 'se.tvhome.launcher'
    compileSdk 34

    defaultConfig {
        applicationId 'se.tvhome.launcher'
        minSdk 26
        targetSdk 34
        // The build number on GitHub is both the version and the release name ("build-N"),
        // which is how the app recognises a newer build.
        def build = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()
        versionCode build
        versionName "build ${build}"
    }

    // One fixed key, kept in the repo, so every build can be installed over the
    // previous one without uninstalling. This is a personal, sideloaded app.
    signingConfigs {
        personal {
            storeFile file('tvhome.jks')
            storePassword 'tvhome-personal'
            keyAlias 'tvhome'
            keyPassword 'tvhome-personal'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.personal
        }
        debug {
            signingConfig signingConfigs.personal
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
